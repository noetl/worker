# Pinned so clippy's lint set cannot move on its own.
#
# The workflow installs `dtolnay/rust-toolchain@stable`, but cargo honours this file
# over the rustup default, so THIS is the version that lints. Verified empirically
# rather than assumed: on noetl/cli, which pins 1.91.1, a CI lint reported its own
# source as `rust-clippy/rust-1.91.0`, while unpinned noetl/tools reported
# `rust-1.99.0` from the same action. The action's console banner prints the stable
# version it installed, which is NOT what cargo used -- reading that banner is what
# briefly convinced me the pin did not work.
#
# 1.99.0 is what this repo was already effectively using (CI's stable on
# 2026-10-03), so pinning changes nothing today and prevents a Rust release from
# reddening `main` with no code change. Bump deliberately, with the lint sweep.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
