# noetl/ai-meta#232 — actually run the tests.
#
# Before this workflow, NO GitHub Actions workflow in this repo (or in
# noetl/server, noetl/tools, noetl/cli) ran `cargo test`.  `release.yml` builds
# and publishes; `semantic-release.yml` versions and tags.  Neither runs a test.
#
# That is worse than having no tests, because the repo has ~860 of them and they
# read as a safety net.  Several are deliberate guards whose entire value is
# failing when someone changes the thing they guard — for example
# `file_env::tests`, which pins the `<VAR>_FILE` precedence the prod secret
# migration depends on (noetl/ai-meta#267), and the metrics-server tests that pin
# the claim-loop liveness decision (noetl/ai-meta#297).
# A guard that no runner executes cannot fail, and a guard that cannot fail is
# indistinguishable from one that was never written.
#
# Deliberately NOT here:
#   * `cargo fmt --check` — these crates are formatted with rustfmt 1.9.0 and a
#     different version reformats large parts of the tree; a CI fmt gate would
#     fail on unrelated files.
#   * `-D warnings` on clippy — `main` currently carries 5 pre-existing warnings.
#     Clippy runs and is visible, but does not gate, so this workflow does not
#     start life red for reasons nobody in this PR caused.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --all-targets, not the default. `cargo build`/`cargo test` alone skip
      # integration tests and `cfg(test)`-only code, so a binary can be broken
      # while the lib compiles clean — that has happened in this repo before.
      - name: build (all targets)
        run: cargo build --all-targets --locked

      - name: test
        run: cargo test --all-targets --locked

      - name: clippy (gating — see the allow-list below)
        # `|| true` was here, which made this step UNABLE to fail: it ran on every PR,
        # appeared in every log, cost its full runtime, and could not report anything
        # (noetl/ai-meta#374). `-D warnings` now gates, with the EXISTING backlog
        # allow-listed by lint NAME so a NEW lint of any other kind fails the build.
        #
        # Measured on origin/main before this change: a bare `-D warnings` produced 15
        # errors across 7 distinct lint kinds, so flipping it outright would have made
        # this job red on arrival — a gate that is red the day it lands is one people
        # learn to skip. Each -A below is tracked debt, not an opinion; deleting one
        # should make the build fail until that lint is fixed. Sweep tracked in
        # noetl/ai-meta#378.
        #
        # NOTE: `dead-code` here covers OVERSIZE_REFUSAL_OUTSTANDING and
        # LAST_SERVE_STATE. Do not simply delete those to clear the lint — a dead
        # static can be a shipped-but-unwired capability rather than garbage; establish
        # which before removing (see #378).
        run: |
          cargo clippy --all-targets --locked -- -D warnings \
            -A clippy::assertions-on-constants \
            -A clippy::cloned-ref-to-slice-refs \
            -A clippy::map-identity \
            -A clippy::ptr-arg \
            -A clippy::unnecessary-filter-map \
            -A dead-code \
            -A duplicate-macro-attributes
